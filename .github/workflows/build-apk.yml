name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: 编译 Release APK
        run: |
          set -o pipefail
          gradle -p . assembleRelease --no-daemon 2>&1 | tee build.log

      - name: 编译失败时输出错误摘要
        if: failure()
        run: |
          echo "===== 错误摘要 ====="
          grep -E "error:|^e: " build.log | head -40 || true
          echo "===== 日志尾部 ====="
          tail -60 build.log || true

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: MoWangDa-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
